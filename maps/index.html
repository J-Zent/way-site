<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Maps · WAY.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400;1,500&display=swap">
<style>
/* Layout: a narrow control rail beside a large map sheet; stacks to one column on phones. */
:root {
  --paper: #EEE8DC;      /* Field paper */
  --stone: #CFC8BA;      /* Stone */
  --ink: #1A1C17;        /* Contour ink */
  --night: #0E100D;      /* Night */
  --bg: #E6E0D2;
  --panel: #EEE8DC;
  --fg: #0E100D;
  --muted: #5C5A50;
  --line: #CFC8BA;
  --stage: #D9D2C3;
  --focus: #0F4E77;
  --sel-bg: #1A1C17;
  --sel-fg: #EEE8DC;
  --warn: #9A2F24;
  --display: "DM Mono", ui-monospace, monospace;
  --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E100D; --panel: #161814; --fg: #EEE8DC; --muted: #A39E92;
    --line: #2B2E27; --stage: #1A1C17; --focus: #8FB6D6; --sel-bg: #EEE8DC; --sel-fg: #0E100D; --warn: #FF8A7E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E100D; --panel: #161814; --fg: #EEE8DC; --muted: #A39E92;
  --line: #2B2E27; --stage: #1A1C17; --focus: #8FB6D6; --sel-bg: #EEE8DC; --sel-fg: #0E100D; --warn: #FF8A7E;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--display); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.app { max-width: 1360px; margin: 0 auto; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
header.top h1 { margin: 0; font-weight: 900; font-size: 26px; letter-spacing: -0.01em; text-wrap: balance; }
header.top p { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); }

.rail { display: flex; flex-direction: column; gap: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; }
.group { display: flex; flex-direction: column; gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
.group > legend, .lab { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 0; }
.group > legend { margin-bottom: 8px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button {
  font: 500 13px/1.2 var(--display); color: var(--fg); background: transparent; border: 0; padding: 9px 8px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.search { display: flex; gap: 6px; }
.field { box-sizing: border-box; width: 100%; min-width: 0; font: 500 13px var(--display); color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 8px 9px; }
.field::placeholder { color: var(--muted); opacity: 0.85; }
.go { font: 700 13px var(--display); background: var(--sel-bg); color: var(--sel-fg); border: 0; border-radius: 5px; padding: 0 14px; cursor: pointer; }
.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.results:empty { display: none; }
.results button { width: 100%; text-align: left; background: transparent; border: 0; color: var(--fg); padding: 8px 10px; cursor: pointer; font: 500 13px/1.3 var(--display); }
.results li + li button { border-top: 1px solid var(--line); }
.results button small { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
.results button:hover { background: var(--bg); }
.msg { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 0; }
.msg.warn { color: var(--warn); }
.msg:empty { display: none; }
.samples { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.samples button { font: 500 12px var(--display); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.samples button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); border-color: var(--sel-bg); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.swatches.two { grid-template-columns: repeat(2, 1fr); }
.sw { display: flex; flex-direction: column; gap: 6px; align-items: stretch; background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px; cursor: pointer; color: var(--fg); font: 500 12px/1.2 var(--display); }
.sw[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.sw .chipc { height: 34px; border-radius: 3px; border: 1px solid rgba(128,128,128,.25); }
.sw .chipc svg { display: block; width: 100%; height: 100%; }

.row { display: flex; gap: 8px; align-items: center; }
.row select, select.field { flex: 1; min-width: 0; }
input[type="range"] { width: 100%; accent-color: var(--fg); margin: 0; }
.rangehead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rangehead output { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.checks label { display: flex; gap: 7px; align-items: center; font-size: 13px; cursor: pointer; }
.checks input { accent-color: var(--fg); width: 15px; height: 15px; margin: 0; }

.actions { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); }
.actions .btn { font: 700 14px var(--display); background: var(--sel-bg); color: var(--sel-fg); border: 0; border-radius: 5px; padding: 11px 12px; cursor: pointer; margin-top: 12px; }
.actions .note { font-family: var(--mono); font-size: 11px; color: var(--muted); margin: 0; min-height: 1.4em; }

.stage { background: var(--stage); border-radius: 6px; padding: clamp(12px, 3vw, 36px); display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; }
.sheetwrap { position: relative; width: 100%; display: flex; justify-content: center; }
.sheet { width: 100%; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 12px 32px -12px rgba(0,0,0,.28); line-height: 0; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
.sheet.dragging { cursor: grabbing; }
.sheet svg { width: 100%; height: auto; display: block; }
.sheet .empty { line-height: 1.5; aspect-ratio: 0.72; display: grid; place-items: center; padding: 24px; background: var(--panel); color: var(--muted); font-family: var(--mono); font-size: 12px; text-align: center; }
.status { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--sel-bg); color: var(--sel-fg); font-family: var(--mono); font-size: 12px; padding: 6px 12px; border-radius: 999px; line-height: 1.4; max-width: calc(100% - 24px); text-align: center; pointer-events: none; }
.status:empty { display: none; }
.caption { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 100%; margin: 0; }

@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { order: 2; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1><a href="/" style="color:inherit;text-decoration:none">WAY.</a> &nbsp;Maps</h1>
    <p>Search any place · drag the map to move it</p>
  </header>

  <aside class="rail" aria-label="Map settings">
    <fieldset class="group">
      <legend>Place</legend>
      <form class="search" id="searchForm" role="search">
        <input class="field" type="search" id="query" placeholder="Place or lat./long." autocomplete="off" aria-label="Search for a place">
        <button class="go" type="submit">Go</button>
      </form>
      <p class="msg" id="searchMsg" aria-live="polite"></p>
      <ul class="results" id="results"></ul>
      <div class="samples" id="samples"><span>Samples</span></div>
      <div class="rangehead"><label for="areaW" class="lab">Area across</label><output id="areaOut" for="areaW"></output></div>
      <input type="range" id="areaW" min="0" max="16" step="1" value="8">
    </fieldset>

    <fieldset class="group">
      <legend>Title</legend>
      <input class="field" id="titleIn" placeholder="Map title" aria-label="Map title">
      <input class="field" id="subIn" placeholder="Subtitle" aria-label="Map subtitle">
    </fieldset>

    <fieldset class="group">
      <legend>Paper</legend>
      <div class="row">
        <select class="field" id="paper" aria-label="Paper size"></select>
      </div>
      <div class="seg" id="orientSeg" role="group" aria-label="Orientation"></div>
    </fieldset>

    <fieldset class="group">
      <legend>Mode</legend>
      <div class="swatches" id="modeSw"></div>
    </fieldset>

    <fieldset class="group">
      <legend>Accent</legend>
      <div class="swatches two" id="accentSw"></div>
    </fieldset>

    <fieldset class="group">
      <legend>Contours</legend>
      <div class="row">
        <select class="field" id="interval" aria-label="Contour interval"></select>
        <div class="seg" id="unitSeg" role="group" style="flex:0 0 96px"></div>
      </div>
      <div class="rangehead"><label for="smooth" class="lab">Contour smoothing</label><output id="smoothOut" for="smooth"></output></div>
      <input type="range" id="smooth" min="0" max="3" step="0.25" value="1.25">
      <div class="rangehead"><label for="waterSmooth" class="lab">Water smoothing</label><output id="waterSmoothOut" for="waterSmooth"></output></div>
      <input type="range" id="waterSmooth" min="0" max="3" step="0.25" value="1">
    </fieldset>

    <fieldset class="group">
      <legend>Layers</legend>
      <div class="checks">
        <label><input type="checkbox" id="lyGrid" checked> Grid</label>
        <label><input type="checkbox" id="lyWater" checked> Water</label>
        <label><input type="checkbox" id="lyPeaks" checked> Summits</label>
        <label><input type="checkbox" id="lyLabels" checked> Labels</label>
        <label><input type="checkbox" id="lyTrails" checked> Trails</label>
        <label><input type="checkbox" id="lyWaterNames" checked> Water names</label>
      </div>
    </fieldset>

    <div class="actions">
      <button class="btn" id="copySvg" type="button">Copy SVG</button>
      <p class="note" id="copyNote" aria-live="polite">The SVG is set to the paper size, ready to print.</p>
    </div>
  </aside>

  <main class="stage">
    <div class="sheetwrap">
      <div class="sheet" id="sheet"></div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
    <p class="caption" id="caption"></p>
  </main>
</div>

<script>/*
 * terrain.js — elevation for any place on Earth, ready for contouring.
 *

 * Web Mercator stretch and the grid on the sheet is a true kilometre grid.
 *

 *   const t = await Terrain.build({ lat, lon, widthM: 10000, aspect: 1.35 });

 *   // t.view (the inner window to show, in grid cells), t.peaks, t.bbox, t.proj, t.lo, t.hi

    }

      let m = tmp[y * w + x];
      for (let i = Math.max(0, y - r); i <= Math.min(h - 1, y + r); i++) m = pick(m, tmp[i * w + x]);
      out[y * w + x] = m;

  }

  // Summits: local high points that stand clear of their surroundings.
  function findPeaks(z, w, h, cell, margin, keep = 9) {
    const zs = blur(z, w, h, 1.5);
    const r = Math.max(4, Math.min(20, Math.round(450 / cell)));
    const mx = rankFilter(zs, w, h, r, true), mn = rankFilter(zs, w, h, r, false);
    let lo = Infinity, hi = -Infinity;
    for (const v of zs) { if (v < lo) lo = v; if (v > hi) hi = v; }
    const drop = Math.max(25, (hi - lo) * 0.04);
    const cand = [];
    for (let y = margin; y < h - margin; y++) for (let x = margin; x < w - margin; x++) {
      const i = y * w + x;
      if (zs[i] !== mx[i] || zs[i] - mn[i] < drop) continue;
      let best = -Infinity, bx = x, by = y;
      for (let yy = y - 2; yy <= y + 2; yy++) for (let xx = x - 2; xx <= x + 2; xx++) {
        const v = z[yy * w + xx]; if (v > best) { best = v; bx = xx; by = yy; }
      }
      cand.push([bx, by, Math.round(best)]);
    }
    cand.sort((a, b) => b[2] - a[2]);
    const out = [];
    for (const c of cand) {
      if (out.every(o => (o[0] - c[0]) ** 2 + (o[1] - c[1]) ** 2 > (r * 1.2) ** 2)) out.push(c);
      if (out.length >= keep) break;
    }
    return out;
  }

  // ---------- tiles ----------
  const tileCache = new Map();
  let canvas = null;

  async function decodeTile(blob) {
    const bmp = await createImageBitmap(blob);
    if (!canvas) { canvas = document.createElement("canvas"); canvas.width = canvas.height = 256; }
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.clearRect(0, 0, 256, 256);
    ctx.drawImage(bmp, 0, 0);
    const px = ctx.getImageData(0, 0, 256, 256).data, out = new Float32Array(256 * 256);

  }

  // Replaceable, so tests (or a different elevation source) can plug in.
  let loadTile = async (z, x, y, signal) => {
    const url = TILE_URL.replace("{z}", z).replace("{x}", x).replace("{y}", y);
    const res = await fetch(url, { signal });
    if (!res.ok) throw new Error(`Elevation tile ${z}/${x}/${y} answered ${res.status}`);
    return decodeTile(await res.blob());
  };

  function getTile(z, x, y, signal) {
    const key = `${z}/${x}/${y}`;
    if (!tileCache.has(key)) {
      const p = loadTile(z, x, y, signal).catch(err => { tileCache.delete(key); throw err; });
      tileCache.set(key, p);
    }
    return tileCache.get(key);
  }

  async function pool(items, n, fn) {
    const out = new Array(items.length);
    let i = 0;
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
      while (i < items.length) { const k = i++; out[k] = await fn(items[k]); }
    }));
    return out;
  }

  // ---------- build a grid for a place ----------
  // lat, lon: centre. widthM: ground width of the map frame in metres. aspect: frame height / width.
  async function build({ lat, lon, widthM, aspect, cellsAcross = 440, signal, onProgress }) {
    const P = { zone: utmZone(lon), a: WGS84.a, rf: WGS84.rf, towgs84: [0, 0, 0], south: lat < 0 };
    const [cE, cN] = toUTM(lon, lat, P);
    const heightM = widthM * aspect;
    const cell = Math.max(widthM, heightM) / cellsAcross;
    const pad = 5;                                     // extra cells around the frame
    const vw = Math.round(widthM / cell), vh = Math.round(heightM / cell);
    const w = vw + 2 * pad, h = vh + 2 * pad;
    const x0 = cE - (w / 2) * cell, y0 = cN + (h / 2) * cell;

    // tile zoom: tile pixels no larger than our cells, capped so a big map stays within ~64 tiles
    const mpp0 = 156543.03392 * Math.cos(lat * D);

    const lons = new Float64Array(w * h), lats = new Float64Array(w * h);
    for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
      const [lo, la] = fromUTM(x0 + (c + 0.5) * cell, y0 - (r + 0.5) * cell, P);
      lons[r * w + c] = lo; lats[r * w + c] = la;
    }
    const gxOf = (lo, z) => (lo + 180) / 360 * 256 * 2 ** z;
    const gyOf = (la, z) => { const s = Math.sin(la * D); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * 2 ** z; };
    let tiles;
    for (;;) {
      let tx0 = Infinity, tx1 = -Infinity, ty0 = Infinity, ty1 = -Infinity;
      for (const i of [0, w - 1, (h - 1) * w, h * w - 1]) {
        const gx = gxOf(lons[i], zoom), gy = gyOf(lats[i], zoom);
        tx0 = Math.min(tx0, Math.floor(gx / 256 - 0.01)); tx1 = Math.max(tx1, Math.floor(gx / 256 + 0.01));
        ty0 = Math.min(ty0, Math.floor(gy / 256 - 0.01)); ty1 = Math.max(ty1, Math.floor(gy / 256 + 0.01));

      const n = (tx1 - tx0 + 1) * (ty1 - ty0 + 1);
      if (n <= 64 || zoom <= 1) { tiles = { tx0, tx1, ty0, ty1, n }; break; }
      zoom--;

    const span = 2 ** zoom;
    for (let ty = tiles.ty0; ty <= tiles.ty1; ty++) for (let tx = tiles.tx0; tx <= tiles.tx1; tx++) list.push([tx, ty]);
    let done = 0;
    const loaded = new Map();
    await pool(list, 8, async ([tx, ty]) => {
      if (ty < 0 || ty >= span) return;
      const data = await getTile(zoom, ((tx % span) + span) % span, ty, signal);
      loaded.set(tx + "," + ty, data);
      if (onProgress) onProgress(++done / list.length);
    });

    const pix = (ix, iy) => {
      const tx = Math.floor(ix / 256), ty = Math.floor(iy / 256), t = loaded.get(tx + "," + ty);
      return t ? t[(iy - ty * 256) * 256 + (ix - tx * 256)] : NaN;
    };
    const z = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) {
      const gx = gxOf(lons[i], zoom) - 0.5, gy = gyOf(lats[i], zoom) - 0.5;
      const ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy;
      const v = pix(ix, iy) * (1 - fx) * (1 - fy) + pix(ix + 1, iy) * fx * (1 - fy) + pix(ix, iy + 1) * (1 - fx) * fy + pix(ix + 1, iy + 1) * fx * fy;
      z[i] = v;
    }
    for (let i = 0; i < z.length; i++) if (!Number.isFinite(z[i])) z[i] = 0;

    // elevation range of the frame, ignoring sea-floor depths when there is land
    let lo = Infinity, hi = -Infinity, loAny = Infinity;
    for (let r = pad; r < h - pad; r++) for (let c = pad; c < w - pad; c++) {
      const v = z[r * w + c];
      if (v > hi) hi = v;
      if (v < loAny) loAny = v;
      if (v > -1 && v < lo) lo = v;
    }
    if (!Number.isFinite(lo)) lo = loAny;

    const corners = [[pad, pad], [w - pad, pad], [pad, h - pad], [w - pad, h - pad]]
      .map(([c, r]) => fromUTM(x0 + c * cell, y0 - r * cell, P));
    const bbox = {
      south: Math.min(...corners.map(c => c[1])), north: Math.max(...corners.map(c => c[1])),
      west: Math.min(...corners.map(c => c[0])), east: Math.max(...corners.map(c => c[0]))
    };

    return {
      w, h, cell, x0, y0, z, lo, hi, proj: P, lat, lon, bbox,
      view: { gx0: pad, gy0: pad, gw: vw, gh: vh },
      peaks: findPeaks(z, w, h, cell, pad + 3),
      zoom, tiles: list.length
    };
  }

  root.Terrain = {
    build, toUTM, fromUTM, utmZone, findPeaks, blur,
    setTileLoader(fn) { loadTile = fn; tileCache.clear(); },
    TILE_URL
  };
})(typeof window !== "undefined" ? window : globalThis);

<script>/*
 * trails.js — load hiking trails from OpenStreetMap and draw them as SVG.
 *
 * Usage:
 *   const trails = await Trails.load({ south, west, north, east });
 *   const svg = Trails.render(trails, {
 *     project: (lon, lat) => [x, y],  // your map's lon/lat -> SVG coordinates
 *     color: "#FF4B3E",                // accent colour for trails
 *     halo: "#EEE8DC",                 // map background colour

    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter",
    "https://overpass.private.coffee/api/interpreter"

  // How each trail kind is drawn. All kinds currently share one even dash;
  // give a kind its own pattern here to tell them apart later.
  const DASH = { dash: "5 3.2", width: 1.5, cap: "butt" };

    const named = spanKm(b) > 25 ? `["name"]` : "";

            const w = left[i], a = ids[0], z = ids[ids.length - 1];
            const wa = w.nodes[0], wz = w.nodes[w.nodes.length - 1];
            let addIds = null, addPts = null, front = false;
            if (wa === z) { addIds = w.nodes.slice(1); addPts = w.coords.slice(1); }
            else if (wz === z) { addIds = w.nodes.slice(0, -1).reverse(); addPts = w.coords.slice(0, -1).reverse(); }

  async function load(bbox, opts = {}) {
    return parse(await overpass(query(bbox), opts));
  }

  // ---------- drawing ----------
  function rdp(pts, eps) {

      const [a, b] = stack.pop();
      const [ax, ay] = pts[a], [bx, by] = pts[b], dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1e-9;
      let dm = 0, idx = -1;
      for (let i = a + 1; i < b; i++) {

        if (d > dm) { dm = d; idx = i; }

  function chaikin(p) {
    if (p.length < 3) return p;

      const a = p[i], b = p[i + 1];

    const total = cum[cum.length - 1], n = Math.max(2, Math.round(total / step) + 1), q = [];
    for (let k = 0, j = 1; k < n; k++) {

        const e = L[endIdx];

          if (b === a) continue;
          for (const pt of lines[b]) {
            const dd = Math.abs(pt[0] - e[0]) + Math.abs(pt[1] - e[1]);

  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  function length(p) { let s = 0; for (let i = 1; i < p.length; i++) s += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return s; }

  // Where to letter a name along a line. Each candidate stretch gets one gentle curve

    for (const line of chainCoast(coast)) {
      const inside = line.pts.every(p => p[0] >= b.x0 && p[0] <= b.x1 && p[1] >= b.y0 && p[1] <= b.y1);
      if (line.closed && inside) { islands.push(line.pts); continue; }
      let pieces = clipLine(line.pts, b);
      if (line.closed && pieces.length > 1 && !pieces[0].startOnEdge && !pieces[pieces.length - 1].endOnEdge) {
        const last = pieces.pop();
        pieces[0] = { pts: last.pts.concat(pieces[0].pts.slice(1)), startOnEdge: true, endOnEdge: pieces[0].endOnEdge };
      }
      for (const pc of pieces) if (pc.startOnEdge && pc.endOnEdge && pc.pts.length > 1) {
        pc.tin = tOf(pc.pts[0]); pc.tout = tOf(pc.pts[pc.pts.length - 1]); open.push(pc);
      }
    }
    const out = [];
    const used = new Set();
    for (const start of open) {
      if (used.has(start)) continue;
      const ring = [];
      let cur = start, guard = 0;
      while (guard++ < open.length + 2) {
        used.add(cur);
        ring.push(...cur.pts);
        let best = null, bd = Infinity;
        for (const q of open) {
          if (used.has(q) && q !== start) continue;
          const dd = (cur.tout - q.tin + PER) % PER;
          if (dd < bd) { bd = dd; best = q; }
        }
        if (!best) break;
        corners
          .map(([t, p]) => ({ dd: (cur.tout - t + PER) % PER, p }))
          .filter(c => c.dd > 0 && c.dd < bd)
          .sort((a, c) => a.dd - c.dd)
          .forEach(c => ring.push(c.p));
        if (best === start) break;
        cur = best;
      }
      if (ring.length > 2) out.push(ring);
    }
    // only islands in view: the sea fills the frame around them
    if (!out.length && islands.length) out.push([[b.x0, b.y0], [b.x1, b.y0], [b.x1, b.y1], [b.x0, b.y1]]);
    return out.concat(islands);
  }

  // ---------- drawing ----------
  function render(water, o) {
    const { project, color, halo } = o;
    const paper = o.paper || "#EEE8DC";
    const font = o.font || "DM Mono, ui-monospace, monospace";
    const prefix = o.idPrefix || "wtr";
    const clip = o.clipId ? ` clip-path="url(#${o.clipId})"` : "";
    const b = o.bounds;
    const placed = (o.avoid || []).slice();
    const free = (x, y, r) => !placed.some(q => Math.hypot(q.x - x, q.y - y) < r);
    const inBounds = (x, y, mx, my) => !b || (x > b.x0 + mx && x < b.x1 - mx && y > b.y0 + my && y < b.y1 - my);
    const out = { areas: "", lines: "", labels: "", shapes: [] };

    // sea, lakes and wide rivers, all solid water colour
    const sea = water.sea   // vector tiles: the sea already comes as finished shapes
      ? water.sea.map(r => rdp(r.map(c => project(c[0], c[1])), 0.4)).filter(r => r.length > 2)
      : b && water.coast && water.coast.length
      ? seaRings(water.coast.map(c => ({ nodes: c.nodes, pts: c.coords.map(q => project(q[0], q[1])) })), b)
      : [];
    const areas = water.areas.map(a => ({
      ...a,
      rs: a.outer.concat(a.inner).map(r => rdp(r.map(c => project(c[0], c[1])), 0.4)).filter(r => r.length > 2)
    })).filter(a => a.rs.length);
    // filled water shapes, so callers can keep other labels off the water
    if (sea.length) out.shapes.push(sea);
    for (const a of areas) out.shapes.push(a.rs);
    // islands are rings inside the sea, so even-odd filling leaves them as land
    const ac = o.areaColor || color;
    if (o.hatch) {
      // big water (sea and large lakes): 45° hatching with a fine shoreline; small ponds stay solid
      const BIG = o.hatchMin || 600;
      const big = [], small = [];
      if (sea.length) big.push(sea);
      for (const a of areas) {
        // a piece cut by a tile edge belongs to something larger, so it qualifies sooner
        const ar = Math.abs(a.rs.reduce((s, r) => s + polyArea(r), 0));
        (ar >= BIG || (a.big && ar >= BIG / 4) ? big : small).push(a.rs);
      }
      // Real lines clipped to the water, not a repeating pattern: patterns leave seams where tiles meet.
      const gap = o.hatchGap || 5, wgt = o.hatchWidth || 1.6;
      const pd = rs => `<path d="${rs.map(r => d(r) + "Z").join("")}" fill-rule="evenodd"/>`;
      const cid = prefix + "-hclip";
      let s = "";
      if (big.length && b) {
        const step = gap * Math.SQRT2, H = b.y1 - b.y0;   // perpendicular spacing = gap
        let lines = "";
        for (let c = b.x0 - H - step; c <= b.x1 + step; c += step) lines += `M${c.toFixed(1)} ${b.y1.toFixed(1)}L${(c + H).toFixed(1)} ${b.y0.toFixed(1)}`;
        s += `<defs><clipPath id="${cid}">${big.map(rs => `<path d="${rs.map(r => d(r) + "Z").join("")}" clip-rule="evenodd"/>`).join("")}</clipPath></defs>`;
        // paper underneath first, so contours and seafloor detail never show through the hatching
        s += `<g${clip}><g fill="${halo}" stroke="none">${big.map(pd).join("")}</g>`;
        s += `<g clip-path="url(#${cid})"><path d="${lines}" fill="none" stroke="${ac}" stroke-width="${wgt}" stroke-linecap="butt"/></g>`;
        // shoreline: from vector tiles only the real edges (never the cuts between tiles); otherwise the shape outlines
        const shoreD = water.shore ? water.shore.map(l => d(l.map(c => project(c[0], c[1])))).join("") : null;
        s += shoreD != null
          ? `<path d="${shoreD}" fill="none" stroke="${ac}" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/></g>`
          : `<g fill="none" stroke="${ac}" stroke-width="1" stroke-linejoin="round">${big.map(pd).join("")}</g></g>`;
      }
      if (small.length) s += `<g${clip} fill="${ac}" stroke="none">${small.map(pd).join("")}</g>`;
      out.areas = s;
      out.hatched = true;
    } else {
      let fill = sea.length ? `<path d="${sea.map(r => d(r) + "Z").join("")}" fill-rule="evenodd"/>` : "";
      for (const a of areas) fill += `<path d="${a.rs.map(r => d(r) + "Z").join("")}" fill-rule="evenodd"/>`;
      if (fill) out.areas = `<g${clip} fill="${ac}" stroke="none">${fill}</g>`;
    }

    // rivers and streams
    const lines = [], sm = o.smooth == null ? 1 : +o.smooth;
    for (const w of water.lines) {
      const raw = w.coords.map(c => project(c[0], c[1]));
      const pts = sm > 0 ? smoothLine(raw, 2, sm * 2.5) : chaikin(rdp(raw, 0.5));
      if (pts.length > 1 && length(pts) > 4) lines.push({ ...w, pts });
    }
    if (sm > 0) snapEnds(lines.map(l => l.pts), 4 + sm * 3);
    // a centre line running inside a wide river shape is hidden; the shape already shows the river
    const riverRs = areas.filter(a => a.river).map(a => a.rs);
    const drawn = lines.filter(l => {
      if (!riverRs.length) return true;
      const inside = l.pts.filter((p, i) => i % 3 === 0 && riverRs.some(rs => insideRings(p, rs))).length;
      return inside < Math.ceil(l.pts.length / 3) * 0.8;
    });
    // short unnamed streams are noise at map scale; seasonal streams are drawn lighter
    const minLen = o.minStream == null ? 60 : o.minStream;
    const shown = drawn.filter(l => l.kind !== "stream" || l.name || length(l.pts) >= minLen);
    const groups = {};
    for (const l of shown) { const k = l.kind + (l.seasonal ? ":s" : ""); (groups[k] = groups[k] || []).push(l); }
    let ln = "";
    for (const k of Object.keys(groups)) {
      const [kind, s] = k.split(":");
      const sw = (WIDTH[kind] || 0.8) * (s ? 0.75 : 1);
      ln += `<path d="${groups[k].map(l => d(l.pts)).join("")}" stroke-width="${sw}"${s ? ` stroke-opacity="0.4"` : ""}/>`;
    }
    if (ln) out.lines = `<g${clip} fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round">${ln}</g>`;

    if (o.names === false) return out;

    const texts = [], defs = [], seen = new Set();
    const max = o.maxLabels || 16;
    const insideText = (x, y, size, name, extra = "") => out.hatched
      ? `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" dominant-baseline="central" stroke-width="9"${extra}>${esc(name)}</text>`
      : `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${size}" dominant-baseline="central" fill="${paper}" stroke="none"${extra}>${esc(name)}</text>`;

    // 1. the sea: name inside, spaced capitals
    if (sea.length && water.seaNames && water.seaNames.length) {
      const ip = interiorPoints(sea, b);
      if (ip.pts && ip.pts.length) {
        const named = water.seaNames.map(s => ({ ...s, xy: project(s.lon, s.lat) }))
          .filter(s => !s.bay || insideRings(s.xy, sea));   // inland bays (lake arms) never name the sea
        // prefer a name whose point is actually in this sea, then the nearest, then the broadest (ocean > sea > bay)
        const anchor = ip.pts[0].p;
        named.sort((a, c) => {
          const ia = insideRings(a.xy, sea) ? 0 : 1, ic = insideRings(c.xy, sea) ? 0 : 1;
          if (ia !== ic) return ia - ic;
          const da = Math.hypot(a.xy[0] - anchor[0], a.xy[1] - anchor[1]), dc = Math.hypot(c.xy[0] - anchor[0], c.xy[1] - anchor[1]);
          return Math.abs(da - dc) > 50 ? da - dc : a.rank - c.rank;
        });
        const s = named[0];
        if (s) {
        const label = s.name.toUpperCase(), size = 12;
        const w = label.length * size * 0.6 * 1.25, h = size * 1.3;
        const target = insideRings(s.xy, sea) && inBounds(s.xy[0], s.xy[1], 0, 0) ? s.xy : anchor;
        const cand = ip.pts.slice(0, 60).sort((a, c) => Math.hypot(a.p[0] - target[0], a.p[1] - target[1]) - Math.hypot(c.p[0] - target[0], c.p[1] - target[1]));
        const spot = cand.find(c => fits(c.p, w, h, ip.simple, ip.frame) && free(c.p[0], c.p[1], 60));
        if (spot) {
          placed.push({ x: spot.p[0], y: spot.p[1] }); seen.add(s.name);
          texts.push(insideText(spot.p[0], spot.p[1], size, label, ` letter-spacing="0.25em"`));
        }
        }
      }
    }

    // 2. lakes (and named wide rivers drawn as shapes), largest first
    const shapes = areas.filter(a => a.name)
      .map(a => ({ a, size: Math.abs(a.rs.reduce((s, r) => s + polyArea(r), 0)) }))
      .sort((x, y) => y.size - x.size);
    for (const { a } of shapes) {
      if (texts.length >= max || seen.has(a.name)) continue;
      const size = 10, w = a.name.length * size * 0.6, h = size * 1.2;
      const ip = interiorPoints(a.rs, b);
      const spot = ip.pts && ip.pts.slice(0, 40).find(c => fits(c.p, w, h, ip.simple, ip.frame) && free(c.p[0], c.p[1], 50));
      if (spot) {
        placed.push({ x: spot.p[0], y: spot.p[1] }); seen.add(a.name);
        texts.push(insideText(spot.p[0], spot.p[1], size, a.name));
        continue;
      }
      if (a.river) continue;   // a narrow river shape gets its name from its centre line below
      // too small to hold its name: blue name beside the lake
      let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
      for (const r of a.rs) for (const p of r) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
      const cy = (y0 + y1) / 2, sw = a.name.length * 8.5 * 0.6;
      const right = { x: x1 + 4, anchor: "start", cx: x1 + 4 + sw / 2 }, left = { x: x0 - 4, anchor: "end", cx: x0 - 4 - sw / 2 };
      const side = [right, left].find(sd => inBounds(sd.cx, cy, sw / 2 + 4, 10) && free(sd.cx, cy, 50));
      if (!side) continue;
      placed.push({ x: side.cx, y: cy }); seen.add(a.name);
      texts.push(`<text x="${side.x.toFixed(1)}" y="${cy.toFixed(1)}" font-size="8.5" dominant-baseline="central" text-anchor="${side.anchor}">${esc(a.name)}</text>`);
    }

    // 3. rivers and streams: inside the river where it is wide enough, otherwise blue alongside
    const riverShapes = areas.filter(a => a.river).map(a => a.rs);
    lines
      .filter(l => l.name)
      .sort((x, y) => (RANK[x.kind] ?? 3) - (RANK[y.kind] ?? 3) || length(y.pts) - length(x.pts))
      .forEach((l, i) => {
        if (texts.length >= max || seen.has(l.name)) return;
        const big = l.kind === "river" || l.kind === "canal";
        const size = big ? 9.5 : 8.5;
        // rivers wind, so search the whole river and accept gentler curves; streams keep the strict test
        const textW = l.name.length * size * 0.62;          // DM Mono italic
        const run = labelRun(l.pts, textW, {
          maxTurn: big ? 50 : 40,
          accept: (m, c) => [c[0], m, c[c.length - 1]].every(q => inBounds(q[0], q[1], 8, 12)) && free(m[0], m[1], 70)
        });
        if (!run) {
          // twisty creek: straight name beside it instead
          const side = sideLabel(l.pts, textW, size, {
            accept: (cs, c) => cs.every(q => inBounds(q[0], q[1], 4, 4)) && free(c[0], c[1], 70)
          });
          if (!side) return;
          placed.push({ x: side.x, y: side.y });
          seen.add(l.name);
          texts.push(`<text font-size="${size}" dominant-baseline="central" transform="translate(${side.x.toFixed(1)} ${side.y.toFixed(1)}) rotate(${side.ang.toFixed(1)})">${esc(l.name)}</text>`);
          return;
        }
        const mid = run[Math.floor(run.length / 2)];
        const wide = riverShapes.find(rs => run.every(p => insideRings(p, rs)) && edgeDist(mid, rs) >= size * 0.65);
        placed.push({ x: mid[0], y: mid[1] });
        seen.add(l.name);
        const id = `${prefix}-${i}`;
        defs.push(`<path id="${id}" d="${d(run)}"/>`);
        texts.push(wide
          ? `<text font-size="${size}" dy="0.35em"${out.hatched ? "" : ` fill="${paper}" stroke="none"`}><textPath href="#${id}" startOffset="50%">${esc(l.name)}</textPath></text>`
          : `<text font-size="${size}" dy="-5"><textPath href="#${id}" startOffset="50%">${esc(l.name)}</textPath></text>`);
      });

    if (o.placedOut) placed.slice((o.avoid || []).length).forEach(p => o.placedOut.push(p));
    if (texts.length) {
      out.labels = (defs.length ? `<defs>${defs.join("")}</defs>` : "") +
        `<g font-family="${font}" font-style="italic" font-weight="500" fill="${color}" stroke="${halo}" stroke-width="3.6" stroke-linejoin="round" paint-order="stroke" text-anchor="middle">${texts.join("")}</g>`;
    }
    return out;
  }

  // true when (x, y) falls on filled water returned by render()
  const onWater = (out, x, y) => !!out && out.shapes.some(rs => insideRings([x, y], rs));

  root.Water = { load, parse, render, query, seaRings, onWater };
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>
(() => {
  // ---------- palette ----------
  const C = {
    paper: "#EEE8DC", stone: "#CFC8BA", matcha: "#89A377", sea: "#0F4E77",
    ink: "#1A1C17", night: "#0E100D", flame: "#FF4B3E", lemon: "#FBD271"
  };
  const MODES = {
    white: { label: "White", bg: "#EEE8DC", minor: "#141414", minorOp: 0.78, index: "#141414", text: "#141414", grid: "#141414", gridOp: 0.38, water: "#4A69B5", area: "#4A69B5", wMinor: 0.55, wIndex: 1.35 },
    night: { label: "Night", bg: "#0E0E0E", minor: C.paper, minorOp: 0.55, index: C.paper, text: C.paper, grid: C.paper, gridOp: 0.3, water: "#A8DCF5", area: "#A8DCF5", wMinor: 0.45, wIndex: 1.1 },
    green: { label: "Green", bg: "#BCC5AA", minor: "#141414", minorOp: 0.8, index: "#141414", text: "#141414", grid: "#141414", gridOp: 0.36, water: "#2F5694", area: "#2F5694", wMinor: 0.55, wIndex: 1.35 }
  };
  const ACCENTS = { flame: { label: "Flame", c: C.flame }, lemon: { label: "Lemonade", c: C.lemon } };
  const FT = 3.28084;

  // ---------- paper ----------
  // sizes in millimetres, short side first
  const IN = 25.4;
  const PAPERS = [
    ["Metric", [["A0", 841, 1189], ["A1", 594, 841], ["A2", 420, 594], ["A3", 297, 420], ["A4", 210, 297], ["A5", 148, 210], ["A6", 105, 148], ["A7", 74, 105]]],
    ["US", [["5 × 7 in", 5 * IN, 7 * IN], ["8 × 10 in", 8 * IN, 10 * IN], ["Letter · 8.5 × 11 in", 8.5 * IN, 11 * IN], ["Legal · 8.5 × 14 in", 8.5 * IN, 14 * IN],
      ["11 × 14 in", 11 * IN, 14 * IN], ["Tabloid · 11 × 17 in", 11 * IN, 17 * IN], ["12 × 18 in", 12 * IN, 18 * IN], ["16 × 20 in", 16 * IN, 20 * IN],
      ["18 × 24 in", 18 * IN, 24 * IN], ["24 × 36 in", 24 * IN, 36 * IN]]]
  ];
  const PAPER = new Map(PAPERS.flatMap(([, list]) => list.map(([n, a, b]) => [n, { name: n, short: a, long: b }])));
  const WIDTHS = [1, 1.5, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50, 60];   // km across the map frame

  // Sheet layout. Everything is drawn on a canvas whose short side is 1044 units at A3;
  // smaller paper gets a smaller canvas (so lines and type print heavier relative to the sheet),
  // larger paper a larger one (so it carries more detail). Weights scale by (297 / short side)^0.62.
  function sheetGeom() {
    const p = PAPER.get(state.paper) || PAPER.get("A3");
    const portrait = state.orient !== "landscape";
    const Pw = portrait ? p.short : p.long, Ph = portrait ? p.long : p.short;
    const k = Math.pow(297 / p.short, 0.62), S = 1044 / k;
    const VW = Pw / p.short * S, VH = Ph / p.short * S;
    const mx = 72, my = 84, mb = 96;
    const MW = VW - 2 * mx, MH = VH - my - mb;
    return { Pw, Ph, S, VW, VH, mx, my, mb, MW, MH, aspect: MH / MW };
  }

  // ---------- state ----------
  const state = {
    place: { kind: "sample", i: 0, cx: null, cy: null }, widthKm: 10, paper: "A3", orient: "portrait", title: "", subtitle: "",
    mode: "white", accent: "flame", units: "ft", interval: "auto", smooth: 1.25, waterSmooth: 1,
    trails: true, waterNames: true, grid: true, water: true, peaks: true, labels: true

  try { const s = JSON.parse(localStorage.getItem("topo-sheet-v2") || "null"); if (s) Object.assign(state, s); } catch (e) {}
  const save = () => { try { localStorage.setItem("topo-sheet-v2", JSON.stringify(state)); } catch (e) {} };

  // ---------- built-in samples ----------

    const bin = atob(L.elev), buf = new ArrayBuffer(bin.length), u8 = new Uint8Array(buf);
    for (let j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);

    let lo = Infinity, hi = -Infinity;
    for (let r = 1; r < L.h - 1; r++) for (let c = 1; c < L.w - 1; c++) { const v = z[r * L.w + c]; if (v < lo) lo = v; if (v > hi) hi = v; }
    return { ...L, id: "sample:" + i, z, lo, hi, srcShort: `ELEVATION: USGS ${L.cell | 0} M DEM` };
  });

  // ---------- live places ----------

  let lastLive = null;
  function liveKey(G) {
    const p = state.place;
    return [p.lat.toFixed(5), p.lon.toFixed(5), state.widthKm, G.aspect.toFixed(3)].join("|");
  }
  function ensureLive(G) {
    const key = liveKey(G);
    if (liveCache.has(key)) return liveCache.get(key);
    const p = state.place, entry = { status: "loading", progress: 0 };
    liveCache.set(key, entry);
    Terrain.build({ lat: p.lat, lon: p.lon, widthM: state.widthKm * 1000, aspect: G.aspect,
      onProgress: f => { entry.progress = f; setStatus(`Loading elevation · ${Math.round(f * 100)}%`); } })
      .then(t => {
        entry.status = "ok";
        entry.L = { ...t, id: "live:" + key, name: p.name, sub: p.sub || "", streams: [],
          source: "Elevation from AWS Terrain Tiles (USGS 3DEP, SRTM and other public sources)", srcShort: "ELEVATION: AWS TERRAIN TILES" };
        lastLive = entry.L;
      })
      .catch(err => { entry.status = "error"; entry.err = String(err && err.message || err); })
      .finally(schedule);
    return entry;
  }

  // The terrain to draw and the window of it the frame shows (in grid cells).
  function currentTerrain(G) {
    const p = state.place;
    if (p.kind === "sample") {
      const L = samples[p.i] || samples[0];
      const maxW = Math.min(L.w - 2, (L.h - 2) / G.aspect);
      const gw = Math.min(maxW, state.widthKm * 1000 / L.cell), gh = gw * G.aspect;
      const cx = p.cx == null ? L.w / 2 : p.cx, cy = p.cy == null ? L.h / 2 : p.cy;
      const gx0 = Math.min(Math.max(1, cx - gw / 2), L.w - 1 - gw), gy0 = Math.min(Math.max(1, cy - gh / 2), L.h - 1 - gh);
      return { L, V: { gx0, gy0, gw, gh }, capped: gw < state.widthKm * 1000 / L.cell - 0.5 };
    }
    const entry = ensureLive(G);
    if (entry.status === "ok") return { L: entry.L, V: entry.L.view };
    if (entry.status === "loading") return { L: lastLive, V: lastLive && lastLive.view, loading: true };
    return { L: null, error: entry.err };
  }

  // ---------- OpenStreetMap layers, per terrain ----------
  const waterData = new Map(), trailData = new Map();
  // The free map servers allow only a couple of requests at a time from one visitor. So we ask
  // only for the map that is showing, wait until the map has stopped moving, ask for water and
  // trails one after the other, and cancel anything still running when the map moves on.
  let osmFor = null, osmTimer = 0, osmCtrl = null;
  function errText(err) {
    const m = String(err && err.message || err);
    if (/429/.test(m)) return "the map data servers are busy (too many requests). Wait a minute, then search again";
    if (/abort|timed? ?out|504/i.test(m)) return "the map data servers took too long. Try a smaller area or search again";
    if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "the map data servers could not be reached";
    return m;
  }
  function ensureOSM(L) {
    const wantWater = (state.water || state.waterNames) && window.Water && !waterData.has(L.id);

    const room = showN ? roomN : MW - coordW - 16;
    const tSize = Math.max(8, Math.min(15, room / (Math.max(1, title.length) * 0.68)));
    const sSize = Math.max(6.5, Math.min(10, room / (Math.max(1, sub.length) * 0.66)));
    parts.push(`<g fill="${M.text}" font-size="10.5" letter-spacing="0.06em">`);
    parts.push(`<text x="${mx}" y="${topY}" font-family="DM Mono, monospace" font-weight="500" font-size="${f1(tSize)}" letter-spacing="0.02em">${esc(title)}</text>`);
    if (sub) parts.push(`<text x="${mx}" y="${topY + 17}" fill-opacity="0.7" font-size="${f1(sSize)}">${esc(sub)}</text>`);
    if (showN) {
      parts.push(`<text x="${f1(VW / 2)}" y="${topY}" text-anchor="middle" font-family="DM Mono, monospace" font-weight="500" font-size="14">N</text>`);
      parts.push(`<path d="M${f1(VW / 2)} ${topY + 8}V${topY + 22}" stroke="${M.text}" stroke-width="1"/>`);
    }
    parts.push(`<text x="${f1(mx + MW)}" y="${topY}" text-anchor="end">${latS}</text>`);
    parts.push(`<text x="${f1(mx + MW)}" y="${topY + 17}" text-anchor="end">${lonS}</text>`);

    const lo = Math.max(vlo > -1 ? 0 : -Infinity, vlo) * (state.units === "ft" ? FT : 1), hi = vhi * (state.units === "ft" ? FT : 1);
    const elevT = `ELEV ${fmt(lo)}–${fmt(hi)} ${unitLbl}`;
    const scaleT = `1:${fmt(scale)} · CONTOUR ${iv} ${unitLbl}${state.grid ? ` · GRID ${spLbl}` : ""}`;
    const omtUsed = [wd, td].some(x => x && x.source === "omt");
    const osmT = omtUsed ? "OPENFREEMAP © OPENMAPTILES · DATA © OPENSTREETMAP" : "MAP DATA © OPENSTREETMAP CONTRIBUTORS";
    const legendW = 84;
    // rows of [left, right]; the elevation range and trail legend take the first rows they fit on
    const rows = [[null, { t: scaleT, size: 10.5 }], [null, { t: L.srcShort, size: 9.5, dim: true }], [null, usesOsm ? { t: osmT, size: 9.5, dim: true } : null]];
    const lefts = [{ t: elevT, size: 10.5 }].concat(showTrails ? [{ legend: true }] : []);
    let row = 0;
    for (const item of lefts) {
      for (; row < 3; row++) {
        const w = item.legend ? legendW : monoW(item.t, item.size), right = rows[row][1];
        if (!right || w + monoW(right.t, right.size) + 16 <= MW) { rows[row][0] = item; row++; break; }
      }
    }
    const ys = [r1, r2, r3];
    rows.forEach(([left, right], i) => {
      const y = ys[i];
      if (right) {
        const leftW = left ? (left.legend ? legendW : monoW(left.t, left.size)) + 16 : 0;
        const size = Math.max(6, Math.min(right.size, (MW - leftW) / (right.t.length * 0.66)));
        parts.push(`<text x="${f1(mx + MW)}" y="${y}" text-anchor="end" font-size="${f1(size)}"${right.dim ? ` fill-opacity="0.75"` : ""}>${esc(right.t)}</text>`);
      }
      if (left && left.legend) {
        parts.push(`<text x="${mx}" y="${y}" font-size="9.5" fill-opacity="0.75">TRAIL</text>`);
        parts.push(`<path d="M${mx + 42} ${y - 3}h38" fill="none" stroke="${A}" stroke-width="1.5" stroke-dasharray="5 3.2"/>`);
      } else if (left) {
        parts.push(`<text x="${mx}" y="${y}">${esc(left.t)}</text>`);
      }
    });
    parts.push(`</g>`);
    parts.push(`</svg>`);

    sheet.innerHTML = parts.join("");
    view = { L, V, s, VW, ext, sample: state.place.kind === "sample" };

    // caption
    let trailNote = "";
    if (state.trails && td) {
      if (td.status === "loading") trailNote = " Loading trails…";
      else if (td.status === "ok") trailNote = td.list.length ? ` ${td.list.length} trail lines from OpenStreetMap.` : " No trails mapped here.";
      else trailNote = " Trails could not load (the map data server is busy or the area is too large). Try a smaller area, or search again in a minute.";
    }
    let waterNote = L.streams.length ? " Water lines are traced from the elevation data." : "";
    if (wd && wd.status === "loading") waterNote = " Loading water…";
    else if (osmWater) waterNote = " Water, coastline and names from OpenStreetMap.";
    else if (wd && wd.status === "error") waterNote += " Water could not load (the map data server is busy or the area is too large). Try a smaller area, or search again in a minute.";
    document.getElementById("caption").textContent =
      `${L.source}. ${G.Pw.toFixed(0)} × ${G.Ph.toFixed(0)} mm at 1:${fmt(scale)}.${waterNote}${trailNote}`;
    syncControls(iv, widthM, G, cur.capped);
  }

  // ---------- controls ----------
  function seg(el, items, cur, onPick) {
    el.innerHTML = "";
    items.forEach(([v, label]) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", String(v === cur));
      b.addEventListener("click", () => onPick(v));
      el.appendChild(b);
    });
  }
  function modeChip(m) {
    return `<svg viewBox="0 0 60 34" preserveAspectRatio="none"><rect width="60" height="34" fill="${m.bg}"/><path d="M-2 26 C14 16 24 30 40 18 S56 10 62 14" fill="none" stroke="${m.index}" stroke-width="1.6"/><path d="M-2 31 C16 22 26 34 42 24 S58 18 62 22M-2 20 C12 10 22 22 38 12 S54 4 62 7" fill="none" stroke="${m.minor}" stroke-opacity="${m.minorOp}" stroke-width="0.8"/></svg>`;
  }
  function swatches(el, entries, cur, onPick) {
    el.innerHTML = "";
    entries.forEach(([k, label, html]) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "sw"; b.setAttribute("aria-pressed", String(k === cur));
      b.innerHTML = `<span class="chipc">${html}</span><span>${label}</span>`;
      b.addEventListener("click", () => onPick(k));
      el.appendChild(b);
    });
  }
  function set(patch) { Object.assign(state, patch); save(); schedule(); }
  let pending = 0;
  function schedule() { cancelAnimationFrame(pending); pending = requestAnimationFrame(render); }
  const setIfIdle = (el, v) => { if (document.activeElement !== el) el.value = v; };

  // paper list, built once
  const paperSel = document.getElementById("paper");
  paperSel.innerHTML = PAPERS.map(([g, list]) => `<optgroup label="${g}">${list.map(([n, a, b]) =>
    `<option value="${n}">${n}${g === "Metric" ? ` · ${a} × ${b} mm` : ""}</option>`).join("")}</optgroup>`).join("");
  paperSel.addEventListener("change", e => set({ paper: e.target.value }));

  // samples
  const samplesEl = document.getElementById("samples");
  samples.forEach((_, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = sampleLabel(i); b.dataset.i = i;
    b.addEventListener("click", () => set({ place: { kind: "sample", i, cx: null, cy: null }, title: "", subtitle: "" }));
    samplesEl.appendChild(b);
  });

  function syncControls(iv, widthM, G, capped) {
    samplesEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(state.place.kind === "sample" && +b.dataset.i === state.place.i)));
    const wi = WIDTHS.reduce((best, v, i) => (Math.abs(v - state.widthKm) < Math.abs(WIDTHS[best] - state.widthKm) ? i : best), 0);
    setIfIdle(document.getElementById("areaW"), wi);
    const shownKm = widthM ? widthM / 1000 : state.widthKm;
    document.getElementById("areaOut").textContent =
      `${shownKm >= 10 ? shownKm.toFixed(0) : shownKm.toFixed(1)} km${capped ? " (sample limit)" : ""}`;
    const titleIn = document.getElementById("titleIn"), subIn = document.getElementById("subIn");
    setIfIdle(titleIn, state.title); setIfIdle(subIn, state.subtitle);
    const L = view && view.L;
    titleIn.placeholder = L && L.name ? L.name : "Map title";
    subIn.placeholder = L && L.sub ? L.sub : "Subtitle";
    paperSel.value = state.paper;
    seg(document.getElementById("orientSeg"), [["portrait", "Portrait"], ["landscape", "Landscape"]], state.orient, v => set({ orient: v }));
    swatches(document.getElementById("modeSw"), Object.entries(MODES).map(([k, m]) => [k, m.label, modeChip(m)]), state.mode, k => set({ mode: k }));
    const bgFor = MODES[state.mode].bg;
    swatches(document.getElementById("accentSw"), Object.entries(ACCENTS).map(([k, a]) =>
      [k, a.label, `<svg viewBox="0 0 60 34" preserveAspectRatio="xMidYMid slice"><rect width="60" height="34" fill="${bgFor}"/><path d="M6 24 C18 14 30 26 54 10" fill="none" stroke="${a.c}" stroke-width="2.2" stroke-dasharray="5 3.2"/></svg>`]),
      state.accent, k => set({ accent: k }));
    seg(document.getElementById("unitSeg"), [["ft", "ft"], ["m", "m"]], state.units, v => set({ units: v, interval: "auto" }));
    const sel = document.getElementById("interval");
    sel.innerHTML = `<option value="auto">Auto${iv ? ` · ${iv} ${state.units}` : ""}</option>` +
      intervalOptions().map(v => `<option value="${v}">${v} ${state.units}</option>`).join("");
    sel.value = String(state.interval);
    setIfIdle(document.getElementById("smooth"), state.smooth);
    document.getElementById("smoothOut").textContent = state.smooth === 0 ? "off" : state.smooth.toFixed(2);
    setIfIdle(document.getElementById("waterSmooth"), state.waterSmooth);
    document.getElementById("waterSmoothOut").textContent = state.waterSmooth === 0 ? "off" : state.waterSmooth.toFixed(2);
    document.getElementById("lyGrid").checked = state.grid;
    document.getElementById("lyWater").checked = state.water;
    document.getElementById("lyPeaks").checked = state.peaks;
    document.getElementById("lyLabels").checked = state.labels;
    document.getElementById("lyTrails").checked = state.trails;
    document.getElementById("lyWaterNames").checked = state.waterNames;
  }

  document.getElementById("areaW").addEventListener("change", e => set({ widthKm: WIDTHS[+e.target.value] }));
  document.getElementById("areaW").addEventListener("input", e => {
    document.getElementById("areaOut").textContent = `${WIDTHS[+e.target.value]} km`;
  });
  document.getElementById("titleIn").addEventListener("input", e => set({ title: e.target.value }));
  document.getElementById("subIn").addEventListener("input", e => set({ subtitle: e.target.value }));
  document.getElementById("interval").addEventListener("change", e => set({ interval: e.target.value }));
  document.getElementById("smooth").addEventListener("input", e => set({ smooth: +e.target.value }));
  document.getElementById("waterSmooth").addEventListener("input", e => set({ waterSmooth: +e.target.value }));
  [["lyGrid", "grid"], ["lyWater", "water"], ["lyPeaks", "peaks"], ["lyLabels", "labels"], ["lyTrails", "trails"], ["lyWaterNames", "waterNames"]].forEach(([id, k]) =>
    document.getElementById(id).addEventListener("change", e => set({ [k]: e.target.checked })));

  // ---------- search ----------
  const searchMsg = document.getElementById("searchMsg"), resultsEl = document.getElementById("results");
  function say(t, warn) { searchMsg.textContent = t || ""; searchMsg.classList.toggle("warn", !!warn); }
  function goLive(p, bboxKm) {
    // a new search retries any water or trails that failed before
    for (const m of [waterData, trailData]) for (const [k, v] of m) if (v.status === "error") m.delete(k);
    const patch = { place: { kind: "live", lat: p.lat, lon: p.lon, name: p.name, sub: p.sub }, title: "", subtitle: "" };
    // fit the place, but never jump past 15 km on its own: big maps load slowly, so going bigger is the visitor's choice
    if (bboxKm && bboxKm >= 2) patch.widthKm = Math.min(15, WIDTHS.find(v => v >= bboxKm * 1.15) || 15);
    resultsEl.innerHTML = ""; say("");
    set(patch);
  }
  document.getElementById("searchForm").addEventListener("submit", async e => {
    e.preventDefault();
    const q = document.getElementById("query").value.trim();
    if (!q) return;
    const m = q.match(/^\s*(-?\d+(?:\.\d+)?)\s*°?\s*([NS])?\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*°?\s*([EW])?\s*$/i);
    if (m) {
      let lat = +m[1], lon = +m[3];
      if (m[2] && /s/i.test(m[2])) lat = -Math.abs(lat);
      if (m[4] && /w/i.test(m[4])) lon = -Math.abs(lon);
      if (Math.abs(lat) > 84 || Math.abs(lon) > 180) { say("Those coordinates are outside the mapped range (latitude up to 84°).", true); return; }
      goLive({ lat, lon, name: `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? "N" : "S"}, ${Math.abs(lon).toFixed(4)}° ${lon >= 0 ? "E" : "W"}`, sub: "" });
      return;
    }
    say("Searching…"); resultsEl.innerHTML = "";
    try {
      const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&accept-language=en&q=" + encodeURIComponent(q);
      const res = await fetch(url);
      if (!res.ok) throw new Error("The place search answered " + res.status);
      const list = await res.json();
      if (!list.length) { say(`No places found for "${q}". Try adding a state or country.`, true); return; }
      say(list.length === 1 ? "" : "Pick a place:");
      resultsEl.innerHTML = "";
      list.forEach(r => {
        const a = r.address || {};
        const name = r.name || r.display_name.split(",")[0];
        const sub = [a.county || a.city || a.town || a.village, a.state, a.country].filter(Boolean).filter(v => v !== name).join(", ");
        const bb = (r.boundingbox || []).map(Number);
        const kmW = bb.length === 4 ? Math.max((bb[3] - bb[2]) * 111.32 * Math.cos(+r.lat * Math.PI / 180), (bb[1] - bb[0]) * 111.32 / sheetGeom().aspect) : 0;
        const li = document.createElement("li"), b = document.createElement("button");
        b.type = "button";
        b.innerHTML = `${esc(name)}<small>${esc(sub || r.type || "")}</small>`;
        b.addEventListener("click", () => goLive({ lat: +r.lat, lon: +r.lon, name, sub }, kmW));
        li.appendChild(b); resultsEl.appendChild(li);
      });
      if (list.length === 1) resultsEl.querySelector("button").click();
    } catch (err) {
      say("Search couldn't reach the place-name service. This preview blocks outside requests; it works on a normal web page. You can still type coordinates, such as 34.44, -119.69.", true);
    }
  });

  // ---------- drag to pan ----------
  const sheetEl = document.getElementById("sheet");
  let drag = null;
  sheetEl.addEventListener("pointerdown", e => {
    if (!view || e.button !== 0) return;
    const svg = sheetEl.querySelector("svg");
    if (!svg) return;
    drag = { x: e.clientX, y: e.clientY, svg, pan: svg.querySelector(".pan"), rect: svg.getBoundingClientRect(), moved: false };
    sheetEl.setPointerCapture(e.pointerId);
  });
  sheetEl.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 3) { drag.moved = true; sheetEl.classList.add("dragging"); }
    if (drag.moved && drag.pan) { const k = view.VW / drag.rect.width; drag.pan.setAttribute("transform", `translate(${(dx * k).toFixed(1)} ${(dy * k).toFixed(1)})`); }
  });
  function endDrag(e) {
    if (!drag) return;
    const d = drag; drag = null; sheetEl.classList.remove("dragging");
    if (!d.moved || !view) return;
    const k = view.VW / d.rect.width;
    const dxc = (e.clientX - d.x) * k / view.s, dyc = (e.clientY - d.y) * k / view.s;   // in grid cells
    const { L, V } = view;
    if (view.sample) {
      set({ place: { ...state.place, cx: V.gx0 + V.gw / 2 - dxc, cy: V.gy0 + V.gh / 2 - dyc } });
    } else {
      const E = (view.ext.x0 + view.ext.x1) / 2 - dxc * L.cell, N = (view.ext.yTop + view.ext.yBot) / 2 + dyc * L.cell;
      const [lon, lat] = Terrain.fromUTM(E, N, L.proj);
      set({ place: { ...state.place, lat, lon } });
    }
  }
  sheetEl.addEventListener("pointerup", endDrag);
  sheetEl.addEventListener("pointercancel", () => { if (drag) { if (drag.pan) drag.pan.removeAttribute("transform"); drag = null; sheetEl.classList.remove("dragging"); } });

  // ---------- copy ----------
  document.getElementById("copySvg").addEventListener("click", () => {
    const svgEl = document.querySelector("#sheet svg");
    const note = document.getElementById("copyNote");
    if (!svgEl) { note.textContent = "There's no map to copy yet."; return; }
    const svg = svgEl.outerHTML.replace(/ style="[^"]*transform[^"]*"/, "");
    const ok = "SVG copied, sized to the paper. Paste it into Illustrator, Figma or a .svg file.";
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = svg; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let done = false; try { done = document.execCommand("copy"); } catch (e) {}
      ta.remove(); note.textContent = done ? ok : "Copy was blocked here. Try again from the full page view.";
    };
    try { navigator.clipboard.writeText(svg).then(() => { note.textContent = ok; }, fallback); } catch (e) { fallback(); }
  });

  render();
})();
</script>

</body>
</html>
